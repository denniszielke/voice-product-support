<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyclePro Bike Renting — Voice (WebRTC)</title>
<style>
  :root { color-scheme: light dark; --accent: #2d7cd6; --ok: #1a8a3a; --warn: #d6882d; --err: #b53030; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  legend { padding: 0 6px; font-weight: 600; }
  button {
    padding: 8px 14px; border-radius: 6px; border: 1px solid #8886;
    background: var(--accent); color: white; font: inherit; cursor: pointer;
    margin-right: 6px;
  }
  button.secondary { background: transparent; color: inherit; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: #8883; font-size: 0.85rem; margin-left: 8px;
  }
  .status-pill.connected { background: var(--ok); color: white; }
  .status-pill.error { background: var(--err); color: white; }
  .indicator { width: 12px; height: 12px; border-radius: 50%; background: #888; display: inline-block; margin-left: 8px; vertical-align: middle; }
  .indicator.speaking { background: var(--ok); animation: pulse 0.8s infinite alternate; }
  .indicator.listening { background: var(--warn); animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

  #convo { display: flex; flex-direction: column; gap: 6px; min-height: 80px; }
  .bubble { padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  .user { background: var(--accent); color: white; align-self: flex-end; text-align: right; }
  .bot  { background: #8882; align-self: flex-start; }

  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card {
    border: 1px solid #8886; border-radius: 10px; padding: 10px; background: #0001;
    display: flex; flex-direction: column; gap: 4px;
  }
  .card h3 { margin: 0; font-size: 1rem; }
  .card .meta { font-size: 0.82rem; opacity: 0.8; }
  .card .price { font-weight: 600; color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .actions button { background: #8884; color: inherit; padding: 4px 10px; font-size: 0.85rem; }

  .reservation, .booking, .update {
    border: 1px dashed #8886; border-radius: 8px; padding: 8px 12px; margin: 6px 0;
    background: #0001; font-size: 0.9rem;
  }
  .booking { border-color: var(--ok); }
  .reservation { border-color: var(--warn); }

  #log {
    height: 160px; overflow: auto; font-family: ui-monospace, monospace;
    font-size: 0.78rem; background: #0001; padding: 8px; border-radius: 6px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<h1>🚴 CyclePro Bike Renting — Voice (WebRTC + Voice Live + invocations)</h1>

<fieldset>
  <legend>Connection</legend>
  <button id="btnStart" onclick="start()">Start mic & connect</button>
  <button id="btnStop" class="secondary" onclick="stop()" disabled>Stop</button>
  <span id="statusPill" class="status-pill">idle</span>
  <span id="indicator" class="indicator"></span>
  <div style="margin-top: 8px; font-size: 0.85rem; opacity: 0.8;">
    Voice Live handles speech. Each turn is sent to
    <code id="invUrlLabel">/invocations</code> via the local bridge.
  </div>
</fieldset>

<fieldset>
  <legend>Conversation</legend>
  <div id="convo"></div>
</fieldset>

<fieldset>
  <legend>Bikes &amp; bookings</legend>
  <div id="cards"></div>
  <div id="confirmations"></div>
</fieldset>

<fieldset>
  <legend>Event log</legend>
  <div id="log"></div>
</fieldset>

<script type="module">
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let signalWs = null;
let pc = null;
let localStream = null;
let dataChannel = null;
let audioEl = null;
let sessionConfigured = false;
const SESSION_ID = "web-" + crypto.randomUUID().slice(0, 8);
let inflight = false;       // true while we're waiting for /invoke
let pendingTranscript = ""; // accumulator for current user turn

const $ = (id) => document.getElementById(id);

// Default WS URL based on current page
function defaultWsUrl() {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return `${scheme}//${location.host}/ws`;
}

// ---------------------------------------------------------------------------
// UI helpers
// ---------------------------------------------------------------------------
function log(msg, kind = "") {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${kind ? "(" + kind + ") " : ""}${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(text, cls) {
  const pill = $("statusPill");
  pill.textContent = text;
  pill.className = "status-pill" + (cls ? ` ${cls}` : "");
}

function setIndicator(state) {
  $("indicator").className = "indicator" + (state ? ` ${state}` : "");
}

function addBubble(text, role) {
  const div = document.createElement("div");
  div.className = `bubble ${role}`;
  div.textContent = text;
  $("convo").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return div;
}

function renderUiEvents(events) {
  for (const evt of events) {
    switch (evt.type) {
      case "ui.bike_cards":      renderBikeCards(evt.bikes || []); break;
      case "ui.bike_detail":     renderBikeDetail(evt.bike || {}); break;
      case "ui.action_buttons":  renderActions(evt.actions || []); break;
      case "ui.reservation_confirmed": renderReservation(evt.reservation || {}); break;
      case "ui.booking_confirmed":     renderBooking(evt.booking || {}); break;
      case "ui.booking_update":  renderUpdate(evt); break;
      default:                   log(`UI event ${evt.type}: ${JSON.stringify(evt)}`);
    }
  }
}

function renderBikeCards(bikes) {
  const container = $("cards");
  container.innerHTML = "";
  for (const b of bikes) {
    const card = document.createElement("div");
    card.className = "card";
    const price = typeof b.rental_price_per_day_eur === "number"
      ? `${b.rental_price_per_day_eur.toFixed(0)} €/day` : "";
    card.innerHTML = `
      <h3>${escapeHtml(b.name || "")}</h3>
      <div class="meta">${escapeHtml(b.brand || "")} — ${escapeHtml(b.category || "")}</div>
      <div class="price">${escapeHtml(price)}</div>
      <div class="meta">${(b.features || []).map(escapeHtml).join(" · ")}</div>
      <div class="meta">${b.available_units ?? "?"} available</div>
    `;
    container.appendChild(card);
  }
}

function renderBikeDetail(b) {
  const container = $("cards");
  container.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3>${escapeHtml(b.name || "")}</h3>
    <div class="meta">${escapeHtml(b.brand || "")} — ${escapeHtml(b.category || "")}</div>
    <div class="price">${(b.rental_price_per_day_eur ?? 0).toFixed(0)} €/day × ${b.rental_days ?? 1} day(s)
      = <strong>${(b.total_eur ?? 0).toFixed(0)} €</strong></div>
    <div class="meta">Deposit: ${(b.deposit_eur ?? 0).toFixed(0)} €</div>
    <div class="meta">${(b.features || []).map(escapeHtml).join(" · ")}</div>
    <div class="meta">${escapeHtml(b.suitable_for || "")}</div>
    <div class="meta">Rider height: ${escapeHtml(b.rider_height_cm || "?")}</div>
  `;
  container.appendChild(card);
}

function renderActions(actions) {
  const last = $("cards").lastElementChild;
  if (!last) return;
  const row = document.createElement("div");
  row.className = "actions";
  for (const a of actions) {
    const btn = document.createElement("button");
    btn.textContent = a.label || a.action || "Action";
    btn.onclick = () => sendClickAction(a);
    row.appendChild(btn);
  }
  last.appendChild(row);
}

function renderReservation(r) {
  const el = document.createElement("div");
  el.className = "reservation";
  el.textContent = `Reserved: ${r.bike_name || ""} — code ${r.reservation_code || ""}` +
                   ` (hold ${r.hold_minutes ?? 30} min, ${r.rental_days ?? 1} day(s))`;
  $("confirmations").appendChild(el);
}

function renderBooking(b) {
  const el = document.createElement("div");
  el.className = "booking";
  el.textContent = `✅ Booked: ${b.bike_name || ""} — code ${b.confirmation_code || ""}` +
                   `, total ${(b.total_eur ?? 0).toFixed(0)} € (+ ${(b.deposit_eur ?? 0).toFixed(0)} € deposit)` +
                   ` for ${b.rental_days ?? 1} day(s)`;
  $("confirmations").appendChild(el);
}

function renderUpdate(evt) {
  const el = document.createElement("div");
  el.className = "update";
  el.textContent = `Update (${evt.change || ""}): ${JSON.stringify({...evt, type: undefined})}`;
  $("confirmations").appendChild(el);
}

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ---------------------------------------------------------------------------
// Voice Live session setup
// ---------------------------------------------------------------------------

const SYSTEM_INSTRUCTIONS = `You are a text-to-speech engine for the CyclePro
bike rental service. The user will send you exact lines of text. Your sole task
is to speak those lines verbatim in a warm, friendly, conversational voice. Do
not add any words, do not omit anything, do not rephrase, do not greet, do not
explain — just speak the provided text as natural speech.`;

async function sendSessionUpdate(voice) {
  const sessionConfig = {
    modalities: ["audio", "text"],
    instructions: SYSTEM_INSTRUCTIONS,
    voice: voice ? { name: voice, type: "azure-standard" } : undefined,
    input_audio_format: "pcm16",
    output_audio_format: "pcm16",
    input_audio_transcription: { model: "whisper-1" },
    turn_detection: {
      type: "server_vad",
      threshold: 0.5,
      prefix_padding_ms: 300,
      silence_duration_ms: 500,
      create_response: false,   // ← critical: we drive responses manually
    },
  };
  // Drop undefined keys so the service doesn't complain.
  for (const k of Object.keys(sessionConfig)) {
    if (sessionConfig[k] === undefined) delete sessionConfig[k];
  }
  signalWs.send(JSON.stringify({ type: "session.update", session: sessionConfig }));
  log("Sent session.update (TTS-echo mode, create_response=false)");
}

// ---------------------------------------------------------------------------
// Main lifecycle
// ---------------------------------------------------------------------------

async function start() {
  $("btnStart").disabled = true;
  $("btnStop").disabled = false;
  setStatus("connecting…");

  // Fetch voice from server config
  let voice = null;
  try {
    const cfg = await fetch("/config").then(r => r.json());
    voice = cfg.voice;
    if (cfg.invocation_url_label) $("invUrlLabel").textContent = cfg.invocation_url_label;
  } catch (e) {
    log(`config fetch failed: ${e.message}`, "warn");
  }

  // 1. Signaling WS
  signalWs = new WebSocket(defaultWsUrl());
  await new Promise((resolve, reject) => {
    signalWs.onopen  = () => { log("Signaling WS connected"); resolve(); };
    signalWs.onerror = () => reject(new Error("signaling WS failed"));
  });
  signalWs.onmessage = (ev) => handleSignalingMessage(JSON.parse(ev.data));
  signalWs.onclose = () => log("Signaling WS closed");

  // 2. Peer connection
  pc = new RTCPeerConnection();

  // 3. Data channel for non-audio events (must be created BEFORE the offer)
  dataChannel = pc.createDataChannel("voice-live-events");
  dataChannel.onopen = () => log("Data channel open");
  dataChannel.onclose = () => log("Data channel closed");
  dataChannel.onmessage = (ev) => handleDataChannelEvent(JSON.parse(ev.data));

  // 4. Microphone
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  log("Microphone granted");

  // 5. Remote audio playback
  audioEl = document.createElement("audio");
  audioEl.autoplay = true;
  document.body.appendChild(audioEl);
  pc.ontrack = (ev) => { audioEl.srcObject = ev.streams[0]; log("Remote audio track attached"); };

  // 6. SDP offer + ICE
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(resolve => {
    if (pc.iceGatheringState === "complete") resolve();
    else pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") resolve();
    });
  });

  // 7. Send offer to Voice Live via signaling proxy
  signalWs.send(JSON.stringify({
    type: "rtc.call.sdp.create",
    sdp_offer: pc.localDescription.sdp,
  }));
  log("Sent SDP offer");

  // 8. Configure the Voice Live session (after SDP exchange completes)
  // We send session.update after `session.created` arrives — see handler.
  window.__voice = voice;
}

function stop() {
  log("Stopping session");
  try { signalWs && signalWs.close(); } catch {}
  try { dataChannel && dataChannel.close(); } catch {}
  try { pc && pc.close(); } catch {}
  try { localStream && localStream.getTracks().forEach(t => t.stop()); } catch {}
  try { audioEl && audioEl.remove(); } catch {}
  signalWs = pc = dataChannel = localStream = audioEl = null;
  sessionConfigured = false;
  $("btnStart").disabled = false;
  $("btnStop").disabled = true;
  setStatus("disconnected");
  setIndicator("");
}

// ---------------------------------------------------------------------------
// Signaling (control channel) messages from Voice Live
// ---------------------------------------------------------------------------

async function handleSignalingMessage(msg) {
  const type = msg.type || "";
  switch (type) {
    case "rtc.call.sdp.created":
      if (msg.sdp_answer) {
        await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp_answer });
        log("Applied remote SDP answer — audio flowing");
        setStatus("connected", "connected");
        setIndicator("listening");
      }
      break;

    case "session.created":
      log(`Session created: ${msg.session?.id || ""}`);
      if (!sessionConfigured) {
        sessionConfigured = true;
        await sendSessionUpdate(window.__voice);
      }
      break;

    case "session.updated":
      log("Session config confirmed");
      break;

    case "rtc.call.error":
    case "error":
      log(`Error: ${JSON.stringify(msg)}`, "error");
      setStatus("error", "error");
      break;

    default:
      log(`Control: ${type}`);
  }
}

// ---------------------------------------------------------------------------
// Data channel events from Voice Live
// ---------------------------------------------------------------------------

function handleDataChannelEvent(msg) {
  const type = msg.type || "";
  switch (type) {
    case "input_audio_buffer.speech_started":
      setIndicator("listening");
      pendingTranscript = "";
      break;

    case "input_audio_buffer.speech_stopped":
      setIndicator("");
      break;

    case "conversation.item.input_audio_transcription.delta":
      pendingTranscript += (msg.delta || "");
      break;

    case "conversation.item.input_audio_transcription.completed":
      const finalText = (msg.transcript || pendingTranscript || "").trim();
      pendingTranscript = "";
      if (!finalText) break;
      addBubble(finalText, "user");
      handleUserTurn(finalText);
      break;

    case "response.audio_transcript.delta":
    case "response.text.delta":
      // Voice Live is echoing our injected text — track it for UI but the
      // authoritative transcript is what we sent ourselves.
      break;

    case "response.done":
      setIndicator("listening");
      break;

    default:
      // log(`Data: ${type}`);
  }
}

// ---------------------------------------------------------------------------
// User turn: call /invoke, then ask Voice Live to speak the reply
// ---------------------------------------------------------------------------

async function handleUserTurn(transcript) {
  if (inflight) {
    log("Turn already in flight — dropping new one", "warn");
    return;
  }
  inflight = true;
  setStatus("thinking…", "connected");

  let data;
  try {
    const resp = await fetch("/invoke", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript, session_id: SESSION_ID }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`HTTP ${resp.status} — ${text}`);
    }
    data = await resp.json();
  } catch (e) {
    log(`/invoke failed: ${e.message}`, "error");
    addBubble(`(error: ${e.message})`, "bot");
    setStatus("error", "error");
    inflight = false;
    return;
  }

  const reply = (data.reply || "").trim();
  if (reply) addBubble(reply, "bot");
  if (Array.isArray(data.ui_events)) renderUiEvents(data.ui_events);

  if (reply) {
    speakReply(reply);
  } else {
    setStatus("connected", "connected");
    setIndicator("listening");
  }
  inflight = false;
}

function speakReply(text) {
  // Inject the reply as a user text item so the model echoes it verbatim per
  // SYSTEM_INSTRUCTIONS, then ask for an audio-only response.
  if (!signalWs || signalWs.readyState !== WebSocket.OPEN) {
    log("Cannot speak reply — signaling WS closed", "warn");
    return;
  }
  signalWs.send(JSON.stringify({
    type: "conversation.item.create",
    item: {
      type: "message",
      role: "user",
      content: [{ type: "input_text", text }],
    },
  }));
  signalWs.send(JSON.stringify({
    type: "response.create",
    response: { modalities: ["audio"] },
  }));
  setIndicator("speaking");
  setStatus("speaking…", "connected");
}

// ---------------------------------------------------------------------------
// Click actions on bike cards
// ---------------------------------------------------------------------------

async function sendClickAction(action) {
  if (inflight) return;
  inflight = true;
  setStatus("thinking…", "connected");

  addBubble(`▶ ${action.label || action.action}`, "user");

  let data;
  try {
    const resp = await fetch(`/invoke`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION_ID, payload: action }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${await resp.text()}`);
    data = await resp.json();
  } catch (e) {
    log(`click /invoke failed: ${e.message}`, "error");
    inflight = false;
    return;
  }

  const reply = (data.reply || "").trim();
  if (reply) { addBubble(reply, "bot"); speakReply(reply); }
  if (Array.isArray(data.ui_events)) renderUiEvents(data.ui_events);
  inflight = false;
}
window.start = start;
window.stop = stop;
</script>
</body>
</html>
