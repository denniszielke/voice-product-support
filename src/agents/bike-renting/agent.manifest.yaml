# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: bike-renting-python-invocations-voicelive
displayName: "Bike Renting Agent"
description: >
  A bike rental agent demonstrating voice + click interactions.
  Handles natural language browsing of the rental fleet via voice,
  and bike selection, reservation, and booking confirmation via
  button clicks. Designed for Voice Live SDK multi-modal scenarios.
metadata:
  voiceLiveCompatible: "true"
  tags:
    - AI Agent Hosting
    - Azure AI AgentServer
    - Invocations Protocol
    - Streaming
    - Voice + Click
template:
  name: bike-renting-python-invocations-voicelive
  kind: hosted
  protocols:
    - protocol: invocations
      version: 1.0.0
  environment_variables: []
resources: []
